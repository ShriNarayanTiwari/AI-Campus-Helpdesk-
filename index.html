<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Assist — Student Information Hub</title>
    <meta
      name="description"
      content="Campus Assist — Student Information Hub designed for GLA University students. Find student resources, campus services, academics, clubs, events, and support in one place."
    />
    <meta property="og:title" content="Campus Assist — Student Information Hub" />
    <meta
      property="og:description"
      content="Find student resources, campus services, and helpful information in one place. Designed for GLA University students."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B1D3A'/%3E%3Cpath d='M8 13l8-4 8 4-8 4-8-4zm3 3.5v4.5c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4.5l-5 2.5-5-2.5z' fill='%232DD4BF'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('campus_assist_theme') ||
            localStorage.getItem('gla_campus_ai_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#071120] dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
